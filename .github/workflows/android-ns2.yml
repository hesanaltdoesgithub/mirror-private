name: Android NS2 APK

on:
  push:
    branches: [ns2-android]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost
          df -h /

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install NDK and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build glslang-tools ccache
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null
          "$SDKM" "ndk;28.2.13676358" "cmake;3.31.5"

      - name: Build APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: |
          chmod +x .ci/android/build.sh
          .ci/android/build.sh -t standard -b Release

      - uses: actions/upload-artifact@v5
        with:
          name: eden-ns2-android
          path: artifacts/*.apk
          if-no-files-found: error
