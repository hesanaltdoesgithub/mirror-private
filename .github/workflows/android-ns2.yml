name: Android NS2 APK

on:
  push:
    branches: [ns2-android]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell /usr/local/lib/node_modules
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile
          sudo fallocate -l 12G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile
          df -h / && free -h

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install NDK and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build glslang-tools ccache
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null
          "$SDKM" "ndk;28.2.13676358" "cmake;3.31.5"

      - name: Build APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: |
          chmod +x .ci/android/build.sh
          set -o pipefail
          .ci/android/build.sh -t standard -b Release -DENABLE_WERROR=OFF 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          free -h; df -h /
          sudo dmesg | grep -iE 'killed process|out of memory' | tail -5 | while read -r l; do echo "::error title=kernel::$l"; done
          grep -E 'error:|FAILED:|BUILD FAILED|Killed|OutOfMemory|No space left' build.log | head -40 | while read -r l; do echo "::error::${l:0:900}"; done
          tail -15 build.log | while read -r l; do echo "::warning title=tail::${l:0:900}"; done

      - uses: actions/upload-artifact@v5
        with:
          name: eden-ns2-android
          path: artifacts/*.apk
          if-no-files-found: error
